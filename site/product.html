<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Girliandy — товар</title>
  <meta name="description" content="Товар магазину Girliandy: світло та затишок для дому.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter+Tight:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="product.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="site-logo" href="index.html">
        <svg viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M14 4 C 8 4, 4 9, 4 16 C 4 21, 8 25, 14 25 C 20 25, 24 21, 24 16 C 24 9, 20 4, 14 4 Z" fill="#08482D"/><path d="M14 25 C 14 18, 16 12, 22 8" stroke="#F5F8EF" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Girliandy</span>
      </a>
      <nav class="site-nav">
        <a href="index.html" data-i18n="nav.home">Головна</a>
        <a href="index.html#catalog" data-i18n="nav.catalog">Каталог</a>
        <a href="about.html" data-i18n="nav.about">Про нас</a>
        <a href="delivery.html" data-i18n="nav.delivery">Доставка та оплата</a>
        <a href="contacts.html" data-i18n="nav.contacts">Контакти</a>
      </nav>
      <div class="lang" role="group" aria-label="Мова"><button type="button" data-lang="uk">UA</button><button type="button" data-lang="ru">RU</button></div>
      <a class="site-cart" href="checkout.html" aria-label="Кошик">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        <span class="count" data-cart-count>0</span>
      </a>
    </div>
  </header>

  <nav class="breadcrumb" aria-label="Навігація">
    <a href="index.html" data-i18n="bc.home">Головна</a><span class="sep">/</span><a href="index.html#catalog" data-i18n="bc.catalog">Каталог</a><span class="sep">/</span><span data-bc-name>…</span>
  </nav>

  <main class="product">
    <div class="product__layout">
      <div class="gallery">
        <div class="gallery__main"><img data-main alt=""></div>
        <div class="gallery__thumbs" data-thumbs></div>
      </div>
      <div class="product__info" data-info></div>
    </div>
  </main>

  <section class="similar">
    <h2 data-i18n="p.similar">Схожі товари</h2>
    <div class="grid" data-similar></div>
  </section>

  <footer>
    <span data-i18n="footer.demo">Демо-магазин · ціни демонстраційні, не є публічною офертою</span>
    <span><span data-i18n="footer.photos">Фото ©</span> <a href="https://www.instagram.com/girliandy/" target="_blank" rel="noopener">@girliandy</a></span>
  </footer>

  <div class="lightbox" data-lightbox hidden>
    <button class="close" type="button" data-lightbox-close aria-label="Закрити">×</button>
    <img data-lightbox-img alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
  </div>
  <div class="toast" data-toast role="status">Додано в кошик</div>

  <script src="data.js"></script>
  <script src="i18n.js"></script>
  <script src="ui.js"></script>
  <script src="cart.js"></script>
  <script src="product.js"></script>
</body>
</html>
